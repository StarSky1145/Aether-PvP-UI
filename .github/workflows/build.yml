name: Build AETHER APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: aether-debug-keystore-v1

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package artifact
        run: |
          mkdir -p dist
          VERSION=$(sed -n "s/.*versionName '\(.*\)'/\1/p" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "dist/aether-ui-${VERSION}-debug.apk"
          sha256sum "dist/aether-ui-${VERSION}-debug.apk" | tee "dist/aether-ui-${VERSION}-debug.apk.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-ui-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
